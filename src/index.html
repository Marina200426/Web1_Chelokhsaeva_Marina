<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор пиццы</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <div class="container">
        <!-- Выбор вида пиццы -->
        <label >Выберите пиццу:</label>
        <div class="pizza-type-container">
            <div class="pizza-type-button" id="pepperoniButton" onclick="selectPizzaType('Пепперони')">
                <img src="assets\img\pepperoni.png" alt="Пепперони">
                <span>Пепперони</span>
            </div>
            <div class="pizza-type-button" id="margaritaButton" onclick="selectPizzaType('Маргарита')">
                <img src="assets\img\margarita.png" alt="Маргарита">
                <span>Маргарита</span>
            </div>
            <div class="pizza-type-button" id="bavarianButton" onclick="selectPizzaType('Баварская')">
                <img src="assets\img\bavarian.png" alt="Баварская">
                <span>Баварская</span>
            </div>
        </div>
        <div class="selection-container">
            <!-- Выбор размера пиццы -->
            <label >Размер пиццы:</label>
            <div class="size-container">
                <div class="size-button" id="smallButton" onclick="selectSize('Маленькая')">Маленькая</div>
                <div class="size-button" id="largeButton" onclick="selectSize('Большая')">Большая</div>
            </div>

            <!-- Выбор добавок -->
            <label >Добавить по вкусу:</label>
            <div class="toppings-container">
                <div class="topping-button" id="cheeseCrustButton" onclick="selectTopping('Сырный бортик')">
                    <img src="assets\img\cheeseCrust.png" alt="Сырный бортик">
                    <span>Сырный бортик</span>
                </div>
                <div class="topping-button" id="creamyMozzarellaButton" onclick="selectTopping('Сливочная моцарелла')">
                    <img src="assets\img\creamyMozzarella.jpg" alt="Сливочная моцарелла">
                    <span>Сливочная моцарелла</span>
                </div>
                <div class="topping-button" id="cheddarParmesanButton" onclick="selectTopping('Чеддер и пармезан')">
                    <img src="assets\img\cheddarParmesan.png" alt="Чеддер и пармезан">
                    <span>Чеддер и пармезан</span>
                </div>
            </div>

            <!-- Кнопка "Добавить в корзину" -->
            <button class="add-to-cart-button" id="addToCartButton">
                Добавить в корзину за <span id="totalPrice">559</span> ₽ (<span id="totalCalories">900</span> кКалл)
            </button>
        </div>
    </div>


    <script src="index.js"></script> 
</body>
</html>
