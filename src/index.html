<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор пиццы</title>
    <link rel="stylesheet" href="/src/assets/styles/style.css"> 
</head>
<body>
    <div class="container">
        <h1>Калькулятор пиццы</h1>
        <label for="pizzaType">Тип пиццы:</label>
        <select id="pizzaType">
            <option value="Маргарита">Маргарита</option>
            <option value="Пепперони">Пепперони</option>
            <option value="Баварская">Баварская</option>
        </select>

        <label for="pizzaSize">Размер пиццы:</label>
        <select id="pizzaSize">
            <option value="Маленькая">Маленькая</option>
            <option value="Большая">Большая</option>
        </select>

        <label>Добавки:</label>
        <label><input type="checkbox" value="сливочная моцарелла"> Сливочная моцарелла</label>
        <label><input type="checkbox" value="сырный борт"> Сырный борт</label>
        <label><input type="checkbox" value="чедер и пармезан"> Чедер и пармезан</label>

        <button onclick="calculatePizza()">Рассчитать</button>

        <div class="result" id="result">
        </div>
    </div>

    <script src="index.js"></script> 
</body>
</html>
