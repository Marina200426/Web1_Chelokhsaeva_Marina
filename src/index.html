<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .todo-item { display: flex; align-items: center; margin: 5px 0; }
        .todo-item input { margin-right: 10px; }
        .delete-btn { margin-left: auto; color: red; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Enter new todo" required>
        <button type="submit">Add Todo</button>
    </form>
    <ul id="todo-list"></ul>
    <script src="index.js"></script>
</body>
</html>
