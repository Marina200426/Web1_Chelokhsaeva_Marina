<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="assets\styles\style.css">
</head>
<body>
  <h1>Todo List</h1>

  <ul id="todoList" class="todo-list"></ul>

  <script src="app.js"></script>
</body>
</html>
